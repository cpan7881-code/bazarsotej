<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সতেজ বাজার - পূর্ণাঙ্গ প্যানেল</title>
    <style>
        :root { --primary: #27ae60; --dark: #2c3e50; --red: #e74c3c; --bg: #f4f7f6; --shadow: 0 4px 15px rgba(0,0,0,0.1); }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; color: #333; }
        
        /* এনিমেশন ও কার্ড */
        .offer-card { background: #fff; padding: 12px; text-align: center; border-bottom: 2px solid #ddd; }
        .blink { animation: blinker 1.5s linear infinite; color: var(--red); font-weight: bold; }
        @keyframes blinker { 50% { opacity: 0; } }
        
        .header { background: var(--primary); color: white; padding: 30px; text-align: center; box-shadow: var(--shadow); }
        .container { max-width: 1000px; margin: auto; padding: 15px; }
        
        /* ড্যাশবোর্ড ও কার্ড */
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid #eee; }
        .promo { background: #e8f5e9; border: 2px dashed var(--primary); text-align: center; }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; border: none; transition: 0.3s; }
        .btn-green { background: var(--primary); color: white; width: 100%; margin-top: 10px; }
        .btn-dark { background: var(--dark); color: white; }
        .btn-red { background: var(--red); color: white; }
        .btn-blue { background: #2980b9; color: white; font-size: 12px; }

        /* মার্কেট গ্রিড */
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; margin-top: 20px; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid #f0f0f0; }
        .product-card img { width: 100%; height: 180px; object-fit: cover; }
        .p-info { padding: 12px; }
        
        .hidden { display: none; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 15px; z-index: 1000; width: 320px; box-shadow: 0 0 50px rgba(0,0,0,0.3); }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; backdrop-filter: blur(3px); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>

<div class="offer-card"><h3 class="blink">🌟 ধামাকা অফার: এডমিনের কাছে LIC করলে লাইফ টাইম ফ্রি!</h3></div>

<div class="header">
    <h1>সতেজ বাজার (Sotej Bazar)</h1>
    <p>সেরা পণ্য সরাসরি কৃষকের ঘর থেকে</p>
</div>

<div class="container">
    <div id="promo-box" class="card promo">
        <h3>আপনি কি পণ্য বিক্রি করতে চান?</h3>
        <button class="btn btn-dark" onclick="openLogin()">সেলার প্যানেল লগইন</button>
    </div>

    <div id="dashboard-area" class="hidden card">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px;">
            <h2 id="dash-title" style="margin:0">ড্যাশবোর্ড</h2>
            <button class="btn btn-red" onclick="location.reload()">লগ আউট</button>
        </div>

        <div id="seller-tools" class="hidden">
            <div id="validity-info" style="background:#fff3cd; padding:10px; border-radius:8px; margin: 15px 0; font-weight:bold; color:#856404; text-align:center;"></div>
            <h3>পণ্য যোগ/এডিট করুন</h3>
            <input type="text" id="pName" placeholder="পণ্যের নাম">
            <div style="display: flex; gap: 10px;">
                <input type="number" id="pPrice" placeholder="মূল্য">
                <select id="pCategory">
                    <option value="সবজি">সবজি</option>
                    <option value="মাছ">মাছ</option>
                    <option value="মাংস">মাংস</option>
                    <option value="মুদি">মুদি</option>
                </select>
                <select id="pUnit" style="width: 100px;">
                    <option value="কেজি">কেজি</option>
                    <option value="লিটার">লিটার</option>
                    <option value="পিস">পিস</option>
                </select>
            </div>
            <input type="text" id="pVillage" placeholder="আপনার গ্রাম">
            <input type="text" id="pAddr" placeholder="মোবাইল নম্বর (WA)">
            <input type="file" id="pImage" accept="image/*" onchange="processImg()">
            <button id="save-btn" class="btn btn-green" onclick="saveProduct()">পাবলিশ করুন</button>
        </div>

        <div id="admin-tools" class="hidden">
            <h3>সেলার ম্যানেজমেন্ট (Admin)</h3>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="newSid" placeholder="আইডি">
                <input type="text" id="newSpass" placeholder="পাসওয়ার্ড">
                <button class="btn btn-dark" onclick="makeSeller()">তৈরি</button>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Pass</th><th>Expiry</th><th>Action</th></tr>
                    </thead>
                    <tbody id="sellerTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="market-section">
        <input type="text" id="search" onkeyup="renderMarket()" placeholder="🔍 পণ্য বা গ্রাম দিয়ে খুঁজুন..." style="border: 2px solid var(--primary);">
        <div class="market-grid" id="marketDisplay"></div>
    </div>

    <div style="text-align: center; margin-top: 40px;">
        <button onclick="openLogin()" style="background:none; border:none; color:#ccc; font-size:10px; cursor:pointer;">Admin Access</button>
    </div>
</div>

<div id="overlay" class="overlay hidden" onclick="closeLogin()"></div>
<div id="login-modal" class="modal hidden">
    <h3 style="margin-top:0">লগইন</h3>
    <input type="text" id="loginId" placeholder="ইউজার আইডি">
    <input type="password" id="loginPass" placeholder="পাসওয়ার্ড">
    <button class="btn btn-green" onclick="doLogin()">প্রবেশ করুন</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, set, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA1EtNa0JMsLC0lFloQYQ0_w860OW8pyxs",
        authDomain: "sotejbazar-7b1bb.firebaseapp.com",
        databaseURL: "https://sotejbazar-7b1bb-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "sotejbazar-7b1bb",
        storageBucket: "sotejbazar-7b1bb.firebasestorage.app",
        appId: "1:1081309783089:web:a74263a6e830986f6a6110"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.currentUser = null;
    window.tempImg = "";
    window.editingId = null;
    let products = [];
    let sellers = [];

    // ডাটা লিসেনার
    onValue(ref(db, 'products'), (snap) => {
        const data = snap.val();
        products = data ? Object.keys(data).map(key => ({...data[key], fireId: key})) : [];
        window.renderMarket(); 
    });

    onValue(ref(db, 'sellers'), (snap) => {
        const data = snap.val();
        sellers = data ? Object.keys(data).map(key => ({...data[key]})) : [];
        if(window.currentUser === "ADMIN") renderSellersList();
    });

    // ছবি রিসাইজ
    window.processImg = function() {
        const file = document.getElementById('pImage').files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 500;
                let width = img.width, height = img.height;
                if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                window.tempImg = canvas.toDataURL('image/jpeg', 0.6);
            };
        };
    };

    // পণ্য সেভ ও এডিট
    window.saveProduct = function() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const village = document.getElementById('pVillage').value;
        const addr = document.getElementById('pAddr').value;
        const category = document.getElementById('pCategory').value;
        const unit = document.getElementById('pUnit').value;

        if(!name || !price || (!window.tempImg && !window.editingId)) return alert("সব তথ্য দিন!");

        const pData = { name, price, village, addr, category, unit, seller: window.currentUser };
        if(window.tempImg) pData.img = window.tempImg;

        if(window.editingId) {
            update(ref(db, 'products/' + window.editingId), pData).then(() => {
                alert("আপডেট হয়েছে!");
                resetForm();
            });
        } else {
            push(ref(db, 'products'), pData).then(() => {
                alert("পাবলিশ হয়েছে!");
                resetForm();
            });
        }
    };

    window.editP = (id) => {
        const p = products.find(x => x.fireId === id);
        document.getElementById('pName').value = p.name;
        document.getElementById('pPrice').value = p.price;
        document.getElementById('pVillage').value = p.village;
        document.getElementById('pAddr').value = p.addr;
        window.editingId = id;
        document.getElementById('save-btn').innerText = "আপডেট করুন";
        window.scrollTo(0,0);
    };

    window.delP = (id) => {
        if(confirm("ডিলিট করবেন?")) remove(ref(db, 'products/' + id));
    };

    // মার্কেট রেন্ডার
    window.renderMarket = function() {
        const d = document.getElementById('marketDisplay');
        const q = document.getElementById('search').value.toLowerCase();
        d.innerHTML = "";
        
        products.forEach(p => {
            if (p.name.toLowerCase().includes(q) || p.village.toLowerCase().includes(q)) {
                const isOwner = (window.currentUser === p.seller || window.currentUser === "ADMIN");
                d.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}">
                        <div class="p-info">
                            <span style="font-size:10px; background:#eee; padding:2px 5px; border-radius:5px">${p.category}</span>
                            <h3 style="margin:5px 0">${p.name}</h3>
                            <div style="color:var(--primary); font-weight:bold">৳ ${p.price} / ${p.unit}</div>
                            <small>📍 ${p.village}</small><br>
                            <a href="https://wa.me/88${p.addr}" target="_blank" style="display:block; text-align:center; background:#25D366; color:white; padding:8px; margin-top:8px; border-radius:5px; text-decoration:none; font-size:12px">WhatsApp Order</a>
                            ${isOwner ? `
                                <div style="display:flex; gap:5px; margin-top:10px">
                                    <button class="btn-blue" onclick="editP('${p.fireId}')" style="flex:1">Edit</button>
                                    <button class="btn-red" onclick="delP('${p.fireId}')" style="flex:1">Del</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>`;
            }
        });
    };

    // লগইন ও ড্যাশবোর্ড
    window.doLogin = function() {
        const id = document.getElementById('loginId').value;
        const pass = document.getElementById('loginPass').value;
        if(id === "admin" && pass === "1234") {
            window.currentUser = "ADMIN";
            showDashboard('admin-tools');
        } else {
            const s = sellers.find(x => x.id === id && x.pass === pass);
            if(s) {
                if(Date.now() > s.expiry) alert("মেয়াদ শেষ!");
                else {
                    window.currentUser = s.id;
                    showDashboard('seller-tools');
                    const days = Math.ceil((s.expiry - Date.now()) / (1000*60*60*24));
                    document.getElementById('validity-info').innerText = "⏳ মেয়াদের বাকি " + days + " দিন";
                }
            } else alert("ভুল তথ্য!");
        }
    };

    // সেলার ম্যানেজমেন্ট
    window.makeSeller = function() {
        const id = document.getElementById('newSid').value;
        const pass = document.getElementById('newSpass').value;
        if(id && pass) {
            const exp = Date.now() + (30 * 24 * 60 * 60 * 1000);
            set(ref(db, 'sellers/' + id), { id, pass, expiry: exp }).then(() => alert("সেলার তৈরি!"));
        }
    };

    window.renewSeller = (sid) => {
        const s = sellers.find(x => x.id === sid);
        update(ref(db, 'sellers/' + sid), { expiry: s.expiry + (30*24*60*60*1000) }).then(()=>alert("রিনিউ হয়েছে"));
    };

    window.deleteSeller = (sid) => { if(confirm("সেলার ডিলিট করবেন?")) remove(ref(db, 'sellers/' + sid)); };

    function renderSellersList() {
        const tb = document.getElementById('sellerTableBody');
        tb.innerHTML = sellers.map(s => `
            <tr>
                <td>${s.id}</td>
                <td style="color:blue; font-weight:bold">${s.pass}</td>
                <td>${new Date(s.expiry).toLocaleDateString()}</td>
                <td>
                    <button class="btn-blue" onclick="renewSeller('${s.id}')">Renew</button>
                    <button class="btn-red" onclick="deleteSeller('${s.id}')">X</button>
                </td>
            </tr>`).join('');
    }

    function resetForm() {
        document.getElementById('pName').value = ""; document.getElementById('pPrice').value = "";
        window.tempImg = ""; window.editingId = null;
        document.getElementById('save-btn').innerText = "পাবলিশ করুন";
    }

    window.openLogin = () => { document.getElementById('login-modal').classList.remove('hidden'); document.getElementById('overlay').classList.remove('hidden'); };
    window.closeLogin = () => { document.getElementById('login-modal').classList.add('hidden'); document.getElementById('overlay').classList.add('hidden'); };
    window.showDashboard = (id) => {
        closeLogin();
        document.getElementById('promo-box').classList.add('hidden');
        document.getElementById('dashboard-area').classList.remove('hidden');
        document.getElementById(id).classList.remove('hidden');
        if(id === 'admin-tools') renderSellersList();
        window.renderMarket();
    };
</script>
</body>
</html>
